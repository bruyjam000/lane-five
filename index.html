<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">
<title>Lane Five — Daily Bowling</title>
<style>
:root{--ink:#f3f6fa;--muted:#9eafc1;--gold:#f5c45e;--cyan:#62d6d0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0;background:#05080d;color:var(--ink);font-family:'Barlow',system-ui,sans-serif}
main{position:fixed;inset:0;max-width:none;padding:0}
.top,h1,.sub,.foot,.side,#message{display:none}
.layout{display:block}
.layout>.card{position:fixed;inset:0;border:0;border-radius:0;background:#05080d}
.layout>.card .view{position:absolute;inset:0}
.layout>.card canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.view::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,#000b 100%)}

.head{position:absolute;top:0;left:0;right:0;z-index:5;border:0;pointer-events:none;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 30px;background:linear-gradient(#05080def,#05080d00);display:flex;justify-content:space-between;align-items:center}
.head strong{font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:22px;text-shadow:0 2px 12px #000}
.badge{background:#ffffff14;border:1px solid #ffffff22;backdrop-filter:blur(8px);color:var(--cyan);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.06em}

.hud{position:absolute;left:16px;top:58px;background:#0b1320aa;backdrop-filter:blur(8px);border:1px solid #ffffff1f;border-radius:12px;padding:8px 14px;font-size:13px;color:var(--muted);pointer-events:none}
.hud b{font-family:'Barlow Condensed',sans-serif;color:var(--gold);font-size:24px;letter-spacing:.04em}

.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(44px,11vw,120px);font-style:italic;font-weight:800;color:var(--gold);text-shadow:0 4px 30px #000;opacity:0;transition:opacity .25s}
.banner.on{opacity:1}

.meter{position:absolute;right:18px;top:16%;height:48%;width:22px;border:1px solid #ffffff33;border-radius:11px;background:#0a1320cc;backdrop-filter:blur(6px);display:none;overflow:hidden;box-shadow:0 4px 20px #0008;pointer-events:none}
.meter.on{display:block}
.meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,#62d6d0,#f5c45e 55%,#ff5e5e);transition:height .04s linear}
.meter span{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}

.controls{position:absolute;bottom:0;left:0;right:0;z-index:5;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,#05080dd8 20%,#05080d00);pointer-events:none}
.controls>*{pointer-events:auto}
.control:has(#aim),.control:has(#power){display:none}

.hook-dial-wrap{background:#0b1320cc;border:1px solid #ffffff22;backdrop-filter:blur(10px);border-radius:16px;padding:7px 12px 5px;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 24px #0008;user-select:none;touch-action:none}
.hook-header{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.hook-header output{color:var(--gold);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
#hookSvg{width:158px;height:64px;cursor:ew-resize;overflow:visible}
#curve{display:none}

.actions{display:flex;gap:10px;align-items:center}
button{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;border:0;border-radius:12px;padding:12px 24px;font-size:17px;font-weight:800;cursor:pointer;background:linear-gradient(#ffd77a,#f0b23e);color:#1b1d26;box-shadow:0 6px 24px #f5c45e44;transition:transform .1s}
button:active{transform:scale(.97)}
button.s{background:#ffffff16;color:var(--ink);border:1px solid #ffffff26;box-shadow:none;backdrop-filter:blur(8px);padding:12px 16px;font-size:15px}
button:disabled{opacity:.4;cursor:not-allowed}

.pop{position:absolute;inset:0;background:#05080db8;display:none;place-items:center;padding:16px;overflow:auto;z-index:10}
.pop.on{display:grid}
.pbox{width:100%;max-width:560px;text-align:center;background:#0b1320e0;border:1px solid #ffffff24;border-radius:20px;padding:24px;backdrop-filter:blur(14px)}
.pbox h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px;font-size:clamp(22px,4vw,30px)}
.psum{margin:14px 0;color:var(--muted)}
.psum b{font-family:'Barlow Condensed',sans-serif;display:block;font-size:52px;color:var(--gold);line-height:1}
.pbox .actions{justify-content:center;margin-top:14px}
.pt{margin:8px 0;font-size:16px}.pt b{color:var(--gold)}
.lbl{font-size:12px;color:var(--muted)}
.frames{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.frame{background:#ffffff0d;border:1px solid #ffffff22;border-radius:9px;padding:7px 2px;text-align:center;min-height:74px}
.frame.on{border-color:var(--gold)}
.frame small{display:block;color:var(--muted);font-size:10px}
.frame b{display:block;margin-top:4px;font-size:13px;letter-spacing:.04em;min-height:19px}
.frame i{display:block;font-style:normal;font-size:17px;font-weight:800;color:var(--gold)}

@media(max-width:520px){
  .controls{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  #hookSvg{width:140px;height:58px}
  button{padding:11px 18px;font-size:16px}
}
</style></head><body>
<main>
<div class="top"><div class="brand">LANE<i>FIVE</i></div><div class="date" id="dateLabel"></div></div>
<div class="layout">
<section class="card">
<div class="head"><strong id="frameTitle"></strong><span class="badge" id="badge"></span></div>
<div class="view">
  <canvas id="game" aria-label="First-person bowling lane"></canvas>
  <div class="hud" id="hud"></div>
  <div class="meter" id="meter"><span>PWR</span><i id="mfill"></i></div>
  <div class="pop" id="pop"></div>
  <div class="banner" id="banner" aria-live="polite"></div>
</div>
<div class="controls">
  <div class="control"><label for="aim"><output id="aimOut">0</output></label><input id="aim" type="range" min="-100" max="100" value="0"></div>
  <div class="control"><label for="power"><output id="powerOut">75%</output></label><input id="power" type="range" min="35" max="100" value="75"></div>

  <!-- Enhanced Hook Dial -->
  <div class="hook-dial-wrap" id="hookDialBox">
    <div class="hook-header"><span>Spin / Hook</span><output id="curveOut">0%</output></div>
    <input id="curve" type="range" min="-100" max="100" value="0">
    <svg id="hookSvg" viewBox="0 0 180 74" aria-label="Hook spin dial">
      <defs>
        <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#62d6d0"/>
          <stop offset="50%" stop-color="#f5c45e"/>
          <stop offset="100%" stop-color="#ff6b9d"/>
        </linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>
      <path d="M 20 60 A 75 75 0 0 1 160 60" fill="none" stroke="#1e2d40" stroke-width="10" stroke-linecap="round"/>
      <path d="M 20 60 A 75 75 0 0 1 160 60" fill="none" stroke="url(#hookGrad)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
      <g id="dialTicks" stroke="#688099" stroke-width="1.5"></g>
      <path id="dialActive" d="" fill="none" stroke="#f5c45e" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
      <text x="16" y="72" fill="#62d6d0" font-size="9" font-weight="800" text-anchor="middle">L</text>
      <text x="90" y="12" fill="#9eafc1" font-size="8" font-weight="700" text-anchor="middle">STRAIGHT</text>
      <text x="164" y="72" fill="#ff6b9d" font-size="9" font-weight="800" text-anchor="middle">R</text>
      <g id="dialKnob" transform="translate(90, 23)">
        <circle r="11" fill="#0b1320" stroke="#f5c45e" stroke-width="2.5"/>
        <circle cx="-3" cy="-3" r="1.5" fill="#f5c45e"/>
        <circle cx="2" cy="-4" r="1.5" fill="#f5c45e"/>
        <circle cx="0" cy="0" r="1.5" fill="#f5c45e"/>
      </g>
    </svg>
  </div>

  <div id="message"></div>

  <div class="actions">
    <button id="bowl">Bowl</button>
    <button class="s" id="reset">Reset</button>
  </div>
</div>
</section>
<aside class="side"><div id="total"></div><div id="frames"></div><div id="rules"></div></aside>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=THREE,$=id=>document.getElementById(id),RB=.108,RP=.075,LW=.53,PIT=-2.3,RG=.12,GX=LW+RG;
let names=[];
const seed=(()=>{let s=new Date().toISOString().slice(0,10).replaceAll('-','');return[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)>>>0})();
const rand=n=>{let x=Math.sin(seed*.001+n*91.7)*43758.5453;return x-Math.floor(x)},hookM=.9+rand(77)*.25;
$('dateLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});

const cv=$('game'),R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.18;R.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new T.Scene();sc.background=new T.Color(0x060a12);sc.fog=new T.Fog(0x060a12,15,34);
const cam=new T.PerspectiveCamera(58,1.45,.05,55);
const tex=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=8;return t};

const laneTex=tex(512,2048,(g,w,h)=>{
 for(let i=0;i<39;i++){g.fillStyle=`hsl(34,58%,${58+rand(i+200)*8}%)`;g.fillRect(i*w/39,0,w/39+1,h)}
 g.globalAlpha=.12;for(let i=0;i<900;i++){g.fillStyle=Math.random()<.5?'#5a3615':'#fff';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random(),8+Math.random()*60)}
 g.globalAlpha=.3;g.strokeStyle='#4a2e18';for(let i=1;i<39;i++){g.beginPath();g.moveTo(i*w/39,0);g.lineTo(i*w/39,h);g.stroke()}
 g.globalAlpha=.55;g.fillStyle='#4a2e18';
 for(let i=0;i<7;i++){const x=w*(.5+(i-3)*.12),y=h*(.64+Math.abs(i-3)*.025);g.beginPath();g.moveTo(x,y-34);g.lineTo(x-10,y+22);g.lineTo(x+10,y+22);g.fill()}
 for(let i=0;i<5;i++){g.beginPath();g.arc(w*(.5+(i-2)*.12),h*.86,4,0,7);g.fill()}
 g.globalAlpha=.8;g.fillRect(0,h-7,w,7)});

const lane=new T.Mesh(new T.PlaneGeometry(1.06,13),new T.MeshStandardMaterial({map:laneTex,roughness:.16,metalness:.05}));
lane.rotation.x=-Math.PI/2;lane.position.set(0,0,5.5);lane.receiveShadow=true;sc.add(lane);

const dark=new T.MeshStandardMaterial({color:0x121820,roughness:.5,metalness:.3});
const wood=new T.MeshStandardMaterial({color:0x3a2616,roughness:.35});
const black=new T.MeshStandardMaterial({color:0x020304,roughness:.9});
const box=(w,h,d,x,y,z,m)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.receiveShadow=true;sc.add(o);return o};

box(9,.1,24,0,-.19,3,dark);
box(2.4,.05,4,0,-.025,14,new T.MeshStandardMaterial({color:0xb98a5a,roughness:.3}));

const gutMat=new T.MeshStandardMaterial({color:0x2b3644,metalness:.5,roughness:.3,side:T.DoubleSide});
const gut=x=>{const m=new T.Mesh(new T.CylinderGeometry(RG,RG,13,28,1,true,-Math.PI/2,Math.PI),gutMat);m.rotation.x=Math.PI/2;m.position.set(x,0,5.5);m.receiveShadow=true;sc.add(m)};
[-1,1].forEach(s=>{
 gut(s*GX);
 box(.39,.1,13.4,s*.965,0,5.4,wood);
 box(.12,.5,1.9,s*.7,.2,-1.65,dark);
 const n=new T.Mesh(new T.BoxGeometry(.04,.04,13),new T.MeshBasicMaterial({color:s<0?0x62d6d0:0xff4fa3}));
 n.position.set(s*1.25,.14,5.5);sc.add(n);
 const l=new T.PointLight(s<0?0x62d6d0:0xff4fa3,.9,7);l.position.set(s*1.2,.7,5);sc.add(l);
 const l2=l.clone();l2.position.z=.5;sc.add(l2);
});

const carpet=tex(256,256,(g,w,h)=>{g.fillStyle='#0c0f1c';g.fillRect(0,0,w,h);const c=['#ff4fa3','#62d6d0','#f5c45e','#7a5cff'];g.globalAlpha=.55;for(let i=0;i<46;i++){g.fillStyle=c[i%4];g.save();g.translate(Math.random()*w,Math.random()*h);g.rotate(Math.random()*6);g.fillRect(0,0,6+Math.random()*14,3);g.restore()}});
carpet.wrapS=carpet.wrapT=T.RepeatWrapping;carpet.repeat.set(10,12);
box(20,.1,32,0,-.185,2,new T.MeshStandardMaterial({map:carpet,roughness:.9}));

[-1,1].forEach(s=>{
 const l2=new T.Mesh(lane.geometry,lane.material);l2.rotation.x=-Math.PI/2;l2.position.set(s*2.1,0,5.5);l2.receiveShadow=true;sc.add(l2);
 box(.42,.1,13.4,s*1.36,0,5.4,wood);
 gut(s*(2.1-GX));gut(s*(2.1+GX));
 box(.53,.1,13.4,s*3.135,0,5.4,wood);
 box(1.4,.05,4,s*2.1,-.025,14,new T.MeshStandardMaterial({color:0xb98a5a,roughness:.3}));
});

const wallM=new T.MeshStandardMaterial({color:0x101722,roughness:.7});
const pitDark=new T.MeshStandardMaterial({color:0x1a2230,roughness:.5,metalness:.35});
const padTex=tex(256,256,(g,w,h)=>{g.fillStyle='#10151d';g.fillRect(0,0,w,h);g.strokeStyle='#26334a';g.lineWidth=5;for(let i=0;i<=w;i+=64){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke()}});
padTex.wrapS=padTex.wrapT=T.RepeatWrapping;padTex.repeat.set(4,1);
box(5.9,.06,1.5,0,-.31,-1.75,new T.MeshStandardMaterial({color:0x0b0f16,roughness:.4,metalness:.5}));
box(5.9,1,.4,0,.2,-2.65,new T.MeshStandardMaterial({map:padTex,roughness:.8}));
box(5.9,.45,.1,0,.9,-2.5,pitDark);
box(5.9,.03,.03,0,.72,-2.43,new T.MeshBasicMaterial({color:0xff4fa3}));
[-1,1].forEach(s=>{box(.54,.8,1.5,s*1.05,.1,-1.75,pitDark);box(.08,.8,1.5,s*2.92,.1,-1.75,pitDark);box(.54,.03,1.5,s*1.05,.51,-1.75,new T.MeshBasicMaterial({color:s<0?0x62d6d0:0xff4fa3}))});
box(22,.2,34,0,3.9,1,dark);
const lp=new T.MeshBasicMaterial({color:0xfff2d8});
[-2.1,0,2.1].forEach(x=>[11,7,3,-1].forEach(z=>{const p=new T.Mesh(new T.BoxGeometry(1.2,.04,.5),lp);p.position.set(x,3.78,z);sc.add(p)}));
box(22,5.5,.3,0,2.4,-3.3,wallM);

const hoodM=new T.MeshStandardMaterial({color:0x2a3340,metalness:.6,roughness:.35}),gl=new T.MeshBasicMaterial({color:0xfff6e0}),gd=new T.MeshBasicMaterial({color:0xf5c45e});
[-2.1,0,2.1].forEach(x=>{
 const h=box(1.5,.5,1.1,x,1.35,-1.65,hoodM);h.castShadow=true;
 box(1.52,.06,.02,x,1.12,-1.09,gd);
 box(1.2,.03,.4,x,1.09,-1.5,gl);
 box(1.15,.05,.05,x,.95,-1.0,hoodM);
 [-.8,.8].forEach(d=>box(.06,1.0,.06,x+d,.6,-2.1,hoodM));
});

const sign=tex(512,200,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#0b1220');gr.addColorStop(1,'#1b2a44');g.fillStyle=gr;g.fillRect(0,0,w,h);g.strokeStyle='#344a63';g.lineWidth=6;g.strokeRect(3,3,w-6,h-6);g.font='900 58px system-ui';g.textAlign='center';g.shadowBlur=22;g.shadowColor='#62d6d0';g.fillStyle='#bff';g.fillText('LANE',w*.31,h*.62);g.shadowColor='#f5c45e';g.fillStyle='#fe9';g.fillText('FIVE',w*.69,h*.62)});

const neonTex=(w,h,fn)=>tex(w,h,(g,W,H)=>{g.clearRect(0,0,W,H);g.lineJoin='round';g.lineCap='round';fn(g,W,H)});
const glowText=(g,t,x,y,col,px)=>{g.font=`900 ${px}px system-ui`;g.textAlign='center';g.textBaseline='middle';
 g.shadowColor=col;g.fillStyle='rgba(0,0,0,0)';
 for(const [bl,lw] of [[50,14],[28,10],[14,6]]){g.shadowBlur=bl;g.strokeStyle=col;g.lineWidth=lw;g.strokeText(t,x,y)}
 g.shadowBlur=8;g.strokeStyle='#fff';g.lineWidth=3;g.strokeText(t,x,y);g.shadowBlur=0};
const glowLine=(g,pts,col,lw=8)=>{g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
 for(const [bl,w] of [[40,lw*1.8],[18,lw],[6,lw*.35]]){g.shadowBlur=bl;g.shadowColor=col;g.strokeStyle=w<lw*.4?'#fff':col;g.lineWidth=w;g.stroke()}g.shadowBlur=0};
const wallTex=tex(2200,550,(g,w,h)=>{
 const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#0e1626');gr.addColorStop(1,'#080d17');g.fillStyle=gr;g.fillRect(0,0,w,h);
 g.strokeStyle='#1b2a40';g.lineWidth=3;for(let x=0;x<w;x+=110){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}
 g.strokeStyle='#142033';g.lineWidth=2;for(let y=0;y<h;y+=110){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
 for(let i=0;i<20;i++){const x=i*110+55;glowLine(g,[[x,490],[x+27,455],[x,420]],i%2?'#62d6d0':'#ff4fa3',4)}
 glowLine(g,[[0,30],[w,30]],'#62d6d0',6);glowLine(g,[[0,h-24],[w,h-24]],'#ff4fa3',6)});
const wallPlane=new T.Mesh(new T.PlaneGeometry(22,5.5),new T.MeshBasicMaterial({map:wallTex,fog:true}));
wallPlane.position.set(0,2.4,-3.14);sc.add(wallPlane);
const bigSign=()=>neonTex(1024,400,(g,w,h)=>{
 glowLine(g,[[40,60],[w-40,60],[w-40,h-60],[40,h-60],[40,60]],'#7a5cff',8);
 glowText(g,'LANE',w*.3,h*.38,'#62d6d0',190);glowText(g,'FIVE',w*.7,h*.38,'#ff4fa3',190);
 glowLine(g,[[120,h*.74],[w-120,h*.74]],'#f5c45e',8);
 glowText(g,'DAILY BOWLING',w/2,h*.87,'#f5c45e',52)});
const pinSign=()=>neonTex(512,512,(g,w,h)=>{
 const pin=(cx,cy,sc,col)=>{g.save();g.translate(cx,cy);g.scale(sc,sc);
  const pts=[[-9,-60],[-14,-48],[-10,-32],[-26,-6],[-30,22],[-18,48],[-18,60],[18,60],[18,48],[30,22],[26,-6],[10,-32],[14,-48],[9,-60],[-9,-60]];
  glowLine(g,pts.map(p=>[p[0],p[1]]),col,5/sc);g.restore()};
 pin(w*.3,h*.5,3.4,'#ff4fa3');pin(w*.7,h*.5,3.4,'#62d6d0');
 g.save();g.translate(w/2,h*.78);glowLine(g,[[-60,0],[-40,-30],[0,-45],[40,-30],[60,0]],'#f5c45e',7);g.restore()});
const bigMat=new T.MeshBasicMaterial({map:bigSign(),transparent:true,depthWrite:false,fog:true});
const pinNeonMat=new T.MeshBasicMaterial({map:pinSign(),transparent:true,depthWrite:false,fog:true});
const SWX=7.8;
[-1,1].forEach(s=>{
 box(.3,5.5,20.6,s*(SWX+.15),2.4,7,wallM);
 const dec=new T.Mesh(new T.PlaneGeometry(20.6,5.5),new T.MeshBasicMaterial({map:wallTex,fog:true}));

function bounce(o){const cx=Math.max(o.cx-o.hw,Math.min(b.x,o.cx+o.hw)),cz=Math.max(o.z-o.hd,Math.min(b.z,o.z+o.hd));
 let dx=b.x-cx,dz=b.z-cz,d=Math.hypot(dx,dz);if(d>=RB)return;if(d<1e-6){dx=0;dz=1;d=1e-6}
 const nx=dx/d,nz=dz/d;b.x+=nx*(RB-d);b.z+=nz*(RB-d);const vn=b.vx*nx+b.vz*nz;if(vn<0){b.vx-=1.7*vn*nx;b.vz-=1.7*vn*nz}}
function bump(o){const dx=b.x-o.cx,dz=b.z-o.z,d=Math.hypot(dx,dz),R2=RB+o.r;if(d>=R2||d<1e-6)return;
 const nx=dx/d,nz=dz/d;b.x+=nx*(R2-d);b.z+=nz*(R2-d);const vn=b.vx*nx+b.vz*nz;if(vn<0){b.vx-=2.15*vn*nx;b.vz-=2.15*vn*nz}}

function step(dt){
 rollT+=dt;
 if(!b.done){let m=1,onR=0;for(const o of obs){const ix=Math.abs(b.x-o.x)<o.hw,iz=Math.abs(b.z-o.z)<(o.hd||0);
  if(o.t==='s'&&ix&&iz){m=3;b.vx+=Math.sin(b.z*7)*1.2*dt}else if(o.t==='f'&&iz&&!b.gut)b.vx+=o.dir*4.2*dt*(b.air?.4:1);else if(o.t==='k'&&ix&&iz&&!b.air){if(o.a>0||Math.hypot(b.vx,b.vz)>3.5)b.vz-=o.a*dt}else if(o.t==='g'&&!b.air){const dx=o.x-b.x,dz=o.z-b.z,d=Math.hypot(dx,dz);if(d<o.r2&&d>.02){const f=(1-d/o.r2)*o.k*dt;b.vx+=dx/d*f;b.vz+=dz/d*f*.5}}else if(o.t==='p'&&!b.air&&!b.pc&&Math.hypot(b.x-o.x,b.z-o.z)<.2){b.x=o.tx;b.z=o.tz;b.pc=1;say('WARP!')}else if(o.t==='r'&&ix&&iz&&!b.air){onR=b.rp=1;b.y=RB+.16*Math.min(1,(o.z+o.hd-b.z)/(2*o.hd))}}
  if(b.rp&&!onR&&!b.air){b.rp=0;b.air=1;b.vy=3.2}if(b.air){b.vy-=9.8*dt;b.y+=b.vy*dt;if(b.y<=RB){b.y=RB;b.air=0}}else if(!onR)b.y=RB;
  stepBall(b,dt,m);
  if(!b.gut&&Math.abs(b.x)>LW+.03&&b.z>.4){b.gut=1;b.vx=0}
  if(b.gut){b.x=(b.x<0?-1:1)*GX;b.y=RB-RG}else if(b.y<RB+.3)obs.forEach(o=>o.t==='b'?bounce(o):o.t==='c'&&bump(o));
  if(b.z<-.95)b.vz*=1-.6*dt;
  if((b.z>12.1&&b.vz>0)||b.z<-2.38||Math.hypot(b.vx,b.vz)<.4)b.done=1;
  if(!b.done&&!b.gut&&b.y<RB+.3&&b.z<1.4)for(const p of pins){if(p.gone)continue;if(coll(b,7,p,1.5,.55,RB+RP)){if(!contact){contact=clk;shake=.35;clack(6)}p.vx+=(Math.random()-.5)*.3;p.vz+=(Math.random()-.5)*.3;react(p)}}}
 for(const p of pins){if(p.gone||!p.st)continue;let s=Math.hypot(p.vx,p.vz);
  if(s>0){const n=Math.min(7,Math.max(0,s-(p.st===1?1.2:3.2)*dt-.5*s*dt))/s;p.vx*=n;p.vz*=n;s*=n}
  p.x+=p.vx*dt;p.z+=p.vz*dt;const fl=p.z<-1.02?-.28:0;if(p.vy||p.y>fl){p.vy-=9.8*dt;p.y+=p.vy*dt;if(p.y<=fl){p.y=fl;p.vy=p.vy<-1.2?-p.vy*.3:0}}
  if(p.st===1){p.th+=p.w*dt;p.w+=18*dt;if(p.th>=1.5708){p.th=1.5708;p.st=2}}else p.yaw+=p.sp*dt*Math.min(1,s/1.5);
  if(p.z<PIT){p.z=PIT;p.vz*=-.25}if(Math.abs(p.x)>.62){p.x=(p.x<0?-.62:.62);p.vx*=-.3}}
 for(let i=0;i<10;i++)for(let j=i+1;j<10;j++){const p=pins[i],q=pins[j];if(p.gone||q.gone||(!p.st&&!q.st))continue;if(coll(p,1.5,q,1.5,.75,2*RP)){react(p);react(q);clack(1)}}
}

const hookSvg=$('hookSvg'),dialTicks=$('dialTicks'),dialActive=$('dialActive'),dialKnob=$('dialKnob');
const CX=90,CY=98,RAD=75;
const polar=(deg,r=RAD)=>{const rad=(deg-90)*Math.PI/180;return[CX+r*Math.cos(rad),CY+r*Math.sin(rad)]};
for(let a=-68;a<=68;a+=17){
 const [x1,y1]=polar(a,RAD-7),[x2,y2]=polar(a,RAD+7);
 const line=document.createElementNS('http://www.w3.org/2000/svg','line');
 line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);
 if(Math.abs(a)<1){line.setAttribute('stroke','#f5c45e');line.setAttribute('stroke-width','2.5')}
 dialTicks.appendChild(line);
}
function renderHookDial(val){
 const deg=(val/100)*68;
 const [kx,ky]=polar(deg,RAD);
 dialKnob.setAttribute('transform',`translate(${kx.toFixed(1)},${ky.toFixed(1)}) rotate(${deg*2.5})`);
 const col=val<-5?'#62d6d0':val>5?'#ff6b9d':'#f5c45e';
 dialKnob.firstElementChild.setAttribute('stroke',col);
 if(Math.abs(val)<2){
  dialActive.setAttribute('d','');
 }else{
  const [sx,sy]=polar(0,RAD);
  const sweep=val>0?1:0;
  dialActive.setAttribute('stroke',col);
  dialActive.setAttribute('d',`M ${sx.toFixed(1)} ${sy.toFixed(1)} A ${RAD} ${RAD} 0 0 ${sweep} ${kx.toFixed(1)} ${ky.toFixed(1)}`);
 }
}
let dialDragging=false;
function setHookFromPointer(e){
 const rect=hookSvg.getBoundingClientRect();
 const x=((e.clientX-rect.left)/rect.width)*180;
 const y=((e.clientY-rect.top)/rect.height)*74;
 let ang=Math.atan2(y-CY,x-CX)*180/Math.PI+90;
 ang=Math.max(-68,Math.min(68,ang));
 const val=Math.round((ang/68)*100);
 $('curve').value=Math.abs(val)<4?0:val;
 updateUI();
}
hookSvg.addEventListener('pointerdown',e=>{dialDragging=true;hookSvg.setPointerCapture(e.pointerId);setHookFromPointer(e)});
hookSvg.addEventListener('pointermove',e=>{if(dialDragging)setHookFromPointer(e)});
const stopDial=()=>{dialDragging=false};
hookSvg.addEventListener('pointerup',stopDial);hookSvg.addEventListener('pointercancel',stopDial);

function scoreAll(){const fl=frames.flatMap(f=>f.r),tot=[];let idx=0,sum=0,ok=true;
 for(let i=0;i<5;i++){let v=null;const a=fl[idx];
  if(frames[i].r.length){if(a===10){if(fl[idx+1]!==undefined&&fl[idx+2]!==undefined)v=10+fl[idx+1]+fl[idx+2];idx+=1}
   else{const c=fl[idx+1];if(c!==undefined){if(a+c===10){if(fl[idx+2]!==undefined)v=10+fl[idx+2]}else v=a+c}idx+=2}}
  if(v===null)ok=false;tot[i]=ok?(sum+=v):null}
 return{tot,sum}}
function marks(r){let up=10;return r.map(k=>{const m=k===up?(up===10?'X':'/'):k||'–';up-=k;if(up<=0)up=10;return m}).join(' ')}

function updateUI(){
 const{tot,sum}=scoreAll();$('total').textContent=sum;
 $('hud').innerHTML=`<b>${sum}</b> pts · Frame ${Math.min(frame+1,5)}/5<br>Pos ${$('aim').value} · Power ${$('power').value}%`;
 drawBoard(tot,sum);
 $('frames').innerHTML=frames.map((f,i)=>`<div class="frame ${i===frame&&state!=='over'?'on':''}"><small>FRAME ${i+1}</small><b>${marks(f.r)||'—'}</b><i>${tot[i]===null?'':tot[i]}</i></div>`).join('');
 $('frameTitle').textContent=state==='over'?'Game complete':`Frame ${frame+1} · ${names[frame]}`;
 $('badge').textContent=state==='over'?'FINAL':`ROLL ${frames[frame].r.length+1}${frame===4?'':' OF 2'}`;
 const aim=+$('aim').value,crv=+$('curve').value;
 $('aimOut').textContent=(aim>0?'+':'')+aim;
 $('curveOut').textContent=(crv>0?'+':'')+crv+'%';
 $('powerOut').textContent=$('power').value+'%';
 renderHookDial(crv);
 $('bowl').disabled=state!=='idle';
 if(state==='idle'){b.x=aim*.0045;b.z=11.7;b.gut=0;px=b.x;pz=b.z;ballM.visible=true;pts.visible=true;
  const a=pg.attributes.position,s={x:b.x,z:11.7,vx:0,curve:crv/100,vz:-9,gut:0};
  for(let i=0;i<NP;i++){a.setXYZ(i,s.x,.02,Math.max(s.z,.3));for(let j=0;j<4;j++)stepBall(s,.0083)}a.needsUpdate=true}
}

let bt;function say(t){const e=$('banner');e.textContent=t;e.classList.add('on');clearTimeout(bt);bt=setTimeout(()=>e.classList.remove('on'),1600)}
function finishRoll(){
 const k=pins.filter(p=>!p.gone&&p.st).length;pins.forEach(p=>{if(!p.gone&&p.st){p.gone=true;p.sw=0}});ballM.visible=false;state='sweep';
 const f=frames[frame],before=standing;f.r.push(k);standing-=k;const n=f.r.length;
 const m=k===before?(before===10?'STRIKE!':'SPARE!'):k===0?(b.gut?'GUTTER BALL':'MISS'):`${k} PIN${k>1?'S':''}`;
 if(k>=8)cheerBoost=2.5;
 say(m);
 if(frame<4)pending=(k===10&&n===1)||n===2?'f':'r';
 else pending=n<2?'r':n>=((f.r[0]===10||f.r[0]+f.r[1]===10)?3:2)?'e':'r';
 const g=gen;setTimeout(()=>g===gen&&advance(),1500);updateUI()}

function cdf(z){const x=Math.abs(z)/Math.SQRT2,t=1/(1+.3275911*x),p=((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*t,e=1-p*Math.exp(-x*x);return .5*(1+(z<0?-e:e))}
function nextLane(){$('pop').classList.remove('on');frame++;loadObs();respot();standing=10;state='idle';updateUI()}
function showPop(fin){const{sum}=scoreAll(),mean=60+(rand(5)-.5)*10,sd=26;
 let h=`<div class="pbox"><h2>${fin?'Game complete':`Frame ${frame+1} complete · ${names[frame]}`}</h2><div class="frames">${$('frames').innerHTML}</div><div class="psum">${fin?'Final score':'Running total'}<b>${sum}</b></div>`;
 if(fin){const cnt=[...Array(15)].map((_,i)=>(i<14?cdf((i*10+10-mean)/sd):1)-(i?cdf((i*10-mean)/sd):0)),mx=Math.max(...cnt),yb=Math.min(14,Math.floor(sum/10)),pct=Math.max(1,Math.min(99,Math.round(cdf((sum+.5-mean)/sd)*100))),bw=560/15;
  h+=`<svg viewBox="0 0 560 190" width="100%" role="img" aria-label="Score distribution"><g transform="translate(0,20)">`+cnt.map((c,i)=>`<rect x="${i*bw+2}" y="${140-c/mx*140}" width="${bw-4}" height="${c/mx*140}" rx="3" fill="${i===yb?'#f5c45e':'#2f4a63'}"/>`).join('')+`<text x="${yb*bw+bw/2}" y="${132-cnt[yb]/mx*140}" text-anchor="middle" fill="#f5c45e" font-size="14" font-weight="800">You</text>`+[0,50,100,150].map((v,i)=>`<text x="${v/150*560}" y="162" fill="#9eafc1" font-size="12" text-anchor="${i?i<3?'middle':'end':'start'}">${v}</text>`).join('')+`</g></svg><p class="pt">You scored better than <b>${pct}%</b> of players today.</p><p class="lbl">Compared against a simulated field of players, not live results.</p><div class="actions"><button id="nxt">Play again</button></div>`}
 else h+=`<div class="actions"><button id="nxt">Next lane: ${names[frame+1]}</button></div>`;
 const p=$('pop');p.innerHTML=h+'</div>';p.classList.add('on');$('nxt').onclick=fin?()=>$('reset').click():nextLane}

function advance(){
 if(pending==='e'){state='over';updateUI();showPop(1);return}
 if(pending==='f'){state='pop';showPop(0);return}
 if(standing<=0){respot();standing=10}
 state='idle';updateUI()}

function bowl(){if(state!=='idle')return;const sp=4.5+(+$('power').value/100)*6.5;
 Object.assign(b,{x:+$('aim').value*.0045,z:11.7,vx:(rand(rc++)-.5)*.06,vz:-sp,curve:+$('curve').value/100,gut:0,done:0,doneT:0,y:RB,vy:0,air:0,rp:0,pc:0});
 state='roll';rollT=0;contact=0;pts.visible=false;px=b.x;pz=b.z;$('bowl').disabled=true;updateUI()}
$('bowl').onclick=bowl;
$('reset').onclick=()=>{gen++;$('pop').classList.remove('on');frames.forEach(f=>f.r=[]);frame=0;standing=10;state='idle';loadObs();respot();updateUI()};
['aim','curve','power'].forEach(i=>$(i).addEventListener('input',updateUI));

const cp=new T.Vector3(0,2.15,15.1),lk=new T.Vector3(0,.9,5.5),tp=new T.Vector3(),tl=new T.Vector3(),ax=new T.Vector3();
function rs(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<1?78:58;cam.updateProjectionMatrix()}
addEventListener('resize',rs);

let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;clk+=dt;
  cheerBoost=Math.max(0,cheerBoost-dt);
 bigMat.opacity=Math.sin(clk*37)*Math.sin(clk*11.3)>.97?.55:1;
 const cheerAmp=cheerBoost>0?0.055:0.015;
 const cheerFreq=cheerBoost>0?11:2.6;
 for(const p of crowdPeople){
  const bob=Math.max(0,Math.sin(clk*cheerFreq+p.phase))*cheerAmp;
  p.g.position.y=p.baseY+bob;
  const wave=cheerBoost>0?Math.sin(clk*14+p.phase)*0.55:Math.sin(clk*2+p.phase)*0.1;
  p.armL.rotation.z=cheerBoost>0?2.4+wave:0.2+wave;
  p.armR.rotation.z=cheerBoost>0?2.4-wave:0.2-wave;
 }

 obs.forEach(o=>{if(o.mv)o.cx=o.x+Math.sin(clk*o.sp)*o.amp;o.m.position.x=o.cx;if(o.t==='f')o.m.userData.bl.rotation.z+=dt*22});

 if(state==='roll'){
  const sd=dt*(contact&&clk-contact<.9?.4:1),n=Math.ceil(sd/.004);
  for(let i=0;i<n;i++)step(sd/n);
  if(b.done)b.doneT+=sd;
  const settled=pins.every(p=>p.gone||!p.st||(p.st===2&&Math.hypot(p.vx,p.vz)<.1));
  const dx=b.x-px,dz=b.z-pz,L=Math.hypot(dx,dz);
  if(L>1e-5){ax.set(dz,0,-dx).normalize();ballM.rotateOnWorldAxis(ax,L/RB)}
  px=b.x;pz=b.z;
  ballM.position.set(b.x,Math.max(-.17,(b.gut?RB-RG:b.y)-Math.max(0,-1-b.z)*.35),b.z);
  ballM.visible=b.z>-2.38;
  if(state==='roll'&&((b.doneT>.7&&settled)||rollT>7))finishRoll();
 }else if(state==='idle'){
  ballM.position.set(b.x,RB,11.7);
 }

 for(const p of pins){
  if(!p.gone){
   if(!p.st&&p.wob>0){p.wob=Math.max(0,p.wob-dt*.3);p.th=p.wob*Math.sin(clk*40)}
   place(p);
  }else if(p.m.visible){
   p.sw+=dt*2;p.m.position.z-=dt*3;p.m.position.y-=dt*.6;
   if(p.sw>1)p.m.visible=false;
  }
 }

 const k=1-Math.exp(-3.5*dt);
 if(state==='idle'||state==='over'){
  tp.set(b.x*.5,2.15,15.1);
  tl.set(b.x*.2,.9,5.5);
 }else{
  tp.set(b.x*.45,1.08,Math.max(b.z+3.4,4.6));
  tl.set(0,.24,-.3);
 }
 cp.lerp(tp,k);lk.lerp(tl,k);shake=Math.max(0,shake-dt);
 cam.position.set(cp.x+(Math.random()-.5)*shake*.06,cp.y+(Math.random()-.5)*shake*.06,cp.z);
 cam.lookAt(lk);
 R.render(sc,cam);
}

let drag=null;const mt=$('meter');
cv.addEventListener('pointerdown',e=>{
 if(state!=='idle')return;
 cv.setPointerCapture(e.pointerId);
 drag={x:e.clientX,y:e.clientY,a:+$('aim').value,dy:0,t:e.pointerType!=='mouse'};
 cv.style.cursor='grabbing';
});
cv.addEventListener('pointermove',e=>{
 if(!drag)return;
 const r=cv.getBoundingClientRect();
 const availDown=Math.max(45,Math.min(r.height*0.2,r.bottom-drag.y-85));
 const rawDy=Math.max(0,e.clientY-drag.y);
 const normDy=Math.min(1,rawDy/availDown);
 drag.dy=normDy;
 if(drag.t)$('aim').value=Math.max(-100,Math.min(100,drag.a+(e.clientX-drag.x)/r.width*380));
 if(rawDy>4){
  $('power').value=Math.round(35+normDy*65);
  mt.classList.add('on');
  $('mfill').style.height=(($('power').value-35)/65*100)+'%';
 }
 updateUI();
});
const endDrag=()=>{
 if(!drag)return;
 const pull=drag.dy;
 drag=null;
 mt.classList.remove('on');
 cv.style.cursor='grab';
 if(pull>.04)bowl();
};
addEventListener('keydown',e=>{
 if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
 if(state!=='idle'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 e.preventDefault();
 $('aim').value=Math.max(-100,Math.min(100,+$('aim').value+(e.key==='ArrowLeft'?-1:1)*(e.shiftKey?1:3)));updateUI();
});
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);

respot();loadObs();updateUI();rs();cam.position.copy(cp);requestAnimationFrame(loop);
})();
</script></body></html>
